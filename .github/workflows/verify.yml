name: Verify website
on:
  push:
  pull_request:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Publish mirror diagnostic
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DETAIL=$(grep -E 'No reachable production origin|Unable to fetch|Error:' dist/storefront-mirror.log 2>/dev/null | tail -1 | tr '\n' ' ' | cut -c1-70)
          if [ -z "$DETAIL" ]; then DETAIL="build failed; inspect storefront mirror"
          fi
          CONTEXT="mirror: ${DETAIL}"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(node -e 'console.log(JSON.stringify({state:"failure", context:process.argv[1], description:"Storefront mirror build failed"}))' "$CONTEXT")"
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
